# 同步上游 (SPlayer-Dev/SPlayer) 并仅构建 macOS arm64 安装包，按版本号发布 Release
name: Sync Upstream & Build macOS arm64

on:
  # 推送到 dev 时构建并发布（主要触发方式）
  push:
    branches:
      - dev
  # 定时同步上游：每天 UTC 20:00（北京时间次日 04:00）
  schedule:
    - cron: "0 20 * * *"
  # 手动触发
  workflow_dispatch:

env:
  NODE_VERSION: 22.x
  UPSTREAM_REPO: https://github.com/SPlayer-Dev/SPlayer.git
  UPSTREAM_BRANCH: dev
  TARGET_BRANCH: dev

# 避免同步 / 构建并发导致的 push 与 release 竞态
concurrency:
  group: sync-and-build-mac
  cancel-in-progress: false

jobs:
  # ===================================================================
  #  同步上游：merge upstream/dev，保留本地自定义修改
  #  仅在定时 / 手动触发时执行；push 触发时代码已是最新，跳过
  # ===================================================================
  sync:
    name: Sync upstream
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

          BEFORE=$(git rev-parse HEAD)
          # 普通 merge：自动合并双方修改，仅在同一处冲突时失败（需人工处理）
          if ! git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "::error::合并上游时发生冲突，请手动解决后再同步"
            git merge --abort || true
            exit 1
          fi
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已合并上游更新：$BEFORE -> $AFTER"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 上游无新提交，已是最新"
          fi

      - name: Push to origin
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:$TARGET_BRANCH"

  # ===================================================================
  #  构建：仅 macOS arm64，并按 package.json 版本号发布 Release
  # ===================================================================
  build:
    name: Build macOS arm64 & Release
    needs: sync
    # 运行条件：push 触发 / 手动触发 / 定时同步且上游有更新
    # 用 !cancelled() 允许在 sync 被跳过（push 场景）时仍然运行
    if: >
      !cancelled() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.sync.result == 'success' && needs.sync.outputs.changed == 'true'))
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clean workspace
        run: |
          echo "🧹 Cleaning workspace, node_modules, and Electron caches..."
          rm -rf dist out node_modules ~/.cache/electron-builder ~/.cache/electron

      # macOS 上安装 LLVM 以支持 Wasm 编译
      - name: Install LLVM
        run: brew install llvm

      - name: Set Environment Variables
        run: |
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "AR=$(brew --prefix llvm)/bin/llvm-ar" >> $GITHUB_ENV

      - name: Copy .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          else
            echo ".env file already exists. Skipping the copy step."
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build macOS arm64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build:mac -- --arm64

      # 读取版本号用于 Release 命名
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 上传构建产物（保留以便排查）
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-macOS-dmg-arm64
          path: dist/*-arm64.dmg

      # 按版本号发布 Release：覆盖同名 Release（含 tag）
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          echo "发布版本：$TAG"
          # 覆盖场景：删除已存在的同名 Release 及其 tag，再重新创建
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "已存在同名 Release，执行覆盖"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "macOS arm64 自动构建 (DMG)" \
            --target "$TARGET_BRANCH" \
            dist/*-arm64.dmg
